[colors]
fg = #cdd6f4
bg = #1e1e2e
rosewater = #f5e0dc
flamingo = #f2cdcd
pink = #f5c2e7
mauve = #cba6f7
red = #f38ba8
maroon = #eba0ac
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
sky = #89dceb
sapphire = #74c7ec
blue = #89b4fa
lavender = #b4befe
subtext1 = #bac2de
subtext0 = #a6adc8
overlay2 = #9399b2
overlay1 = #7f849c
overlay0 = #6c7086
surface2 = #585b70
surface1 = #45475a
surface0 = #313244
mantle = #181825
crust = #11111b


[bar/topbar]
width = 99.5%
height = 30pt
fixed-center = true
offset-x = 5
offset-y = 5
radius = 0
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 3pt
padding-left = 1
padding-right = 1
module-margin = 0
separator = ""

font-0 = JetBrains Mono Medium:size=14;3
font-1 = JetBrains Mono NF Medium:size=14;3

modules-left = s launcher workspaces
modules-center = cpu ram temp
modules-right = volume light xkeyboard wifi date

tray-position = right
tray-padding = 4
tray-maxsize = 16
tray-scale = 1

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
override-redirect = true


[settings]
screenchange-reload = true
pseudo-transparency = true


[module/s]
type = custom/text
content = ""
content-padding = 1


[module/launcher]
type = custom/text
content = 
content-foreground = ${colors.blue}
content-padding = 2
click-left = rofi -show drun -config ~/.config/rofi/launcher.rasi


[module/workspaces]
type = internal/xworkspaces

label-active = 󰫍
label-active-foreground = ${colors.blue}
label-active-underline = ${colors.blue}
label-active-underline-size = 0
label-active-padding = 1

label-occupied = 󰫍
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 1

label-urgent = 󰫍
label-urgent-foreground = ${colors.overlay1}
label-urgent-padding = 1

label-empty = 󰫍
label-empty-foreground = ${colors.overlay1}
label-empty-padding = 1


[module/volume]
type = internal/pulseaudio

format-volume =  <label-volume>
label-volume = %percentage%%
format-volume-foreground = ${colors.green}
format-volume-padding = 2

format-muted =  
format-muted-foreground = ${colors.red}
format-muted-padding = 2

click-left = pavucontrol --tab=1


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = caps lock

format = <label-layout>
label-layout = %icon%
label-layout-foreground = ${colors.fg}
label-layout-padding = 2

layout-icon-0 = us;US
layout-icon-1 = ru;RU


[module/ram]
type = internal/memory
interval = 2

format =  <label>
label = %percentage_used:2%%
format-foreground = ${colors.yellow}
format-padding = 1


[module/cpu]
type = internal/cpu
interval = 2

format =  <label>
label = %percentage:2%%
format-foreground = ${colors.green}
format-padding = 1


[module/wifi]
type = internal/network
interface = wlan0
interval = 1

format-connected = <label-connected>
label-connected = "%{A1:sh $HOME/.config/scripts/wifi.sh:}󰤨%{A}"
label-connected-foreground = ${colors.blue}
format-connected-padding = 2

format-disconnected = <label-disconnected>
label-disconnected = "%{A1:sh $HOME/.config/scripts/wifi.sh:}󰤭%{A}"
label-disconnected-foreground = ${colors.red}
format-disconnected-padding = 2


[module/temp]
type = internal/temperature
thermal-zone = 0
warn-temperature = 70

format =  <label>
label = %temperature%
format-foreground = ${colors.blue}
format-padding = 1

format-warn = 󰈸 <label-warn>
label-warn = %temperature%
format-warn-foreground = ${colors.red}
format-warn-padding = 1


[module/date]
type = internal/date
interval = 1

format = <label>
label = %date%
date = %I:%M %p
date-alt = %d-%m-%y
format-foreground = ${colors.fg}
format-padding = 2
