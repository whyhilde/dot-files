<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300&display=swap" rel="stylesheet"> 
    <script src="scripts/search.js"></script>
    <script src="scripts/load.js"></script>
  </head>

  <body>
    <div class="container">
      <div class="head">

        <div class="logo"><img src="icons/fox.svg" /></div>

        <div class="search_box">

          <img class="engine" id="engineLogo" src="icons/duck.svg" onclick="toggleEngine()" style="cursor:pointer" />

          <div id="gSearch" style="display:block;">
            <form id="textField" class="google" action="https://google.com/search" method="get">
              <input class="input_box" type="text" name="q" placeholder="Search with Google">
              <!-- <button class="button"> <img src="icons/search.svg" style="cursor:pointer" /></button> -->
            </form>
          </div>

          <div id="dSearch" style="display:none;">
            <form class="duck" action="https://duckduckgo.com/" method="get">
              <input class="input_box" type="text" name="q" placeholder="Search with DuckDuckGo">
              <!-- <button class="button"> <img src="icons/search.svg" style="cursor:pointer" /></button> -->
            </form>
          </div>

        </div>

      </div>

      <div class="bookmark">

        <div class="category">
          <div class="icon" style="display: none;"><img src="icons/code.svg" /></div>
          <div class="bookmarks cod" style="display: none;">
          </div>
        </div>

        <div class="category">
          <div class="bookmarks dev">
            <li><a class="bm" href="https://github.com/">GitHub</a></li>
            <li><a class="bm" href="https://chatgpt.com/">ChatGPT</a></li>
            <li><a class="bm" href="https://habr.com/ru/feed/">Habr</a></li>
            <li><a class="bm" href="https://leetcode.com/problemset/algorithms/">LeetCode</a></li>
            <li><a class="bm" href="https://stackoverflow.com/">Stackoverflow</a></li>
          </div>
        </div>

        <div class="category">
          <div class="bookmarks social">
            <li><a class="bm" href="https://www.youtube.com/">YouTube</a></li>
            <li><a class="bm" href="https://www.reddit.com/">Reddit</a></li>
            <li><a class="bm" href="https://mail.google.com/">Gmail</a></li>
            <li><a class="bm" href="https://open.spotify.com/">Spotify</a></li>
            <li><a class="bm" href="https://www.twitch.tv/">Twitch</a></li>
          </div>
        </div>

        <div class="category">
          <div class="bookmarks other">
            <li><a class="bm" href="https://archlinux.org/">Arch Linux</a></li>
            <li><a class="bm" href="https://wiki.hypr.land/">Hyprland</a></li>
            <li><a class="bm" href="https://aur.archlinux.org/packages/">AUR</a></li>
            <li><a class="bm" href="https://translate.yandex.ru/">Translator</a></li>
            <li><a class="bm" href="https://www.nerdfonts.com/">Nerd Fonts</a></li>
          </div>
        </div>

        <div class="category">
          <div class="icon" style="display: none;"><img src="icons/art.svg" /></div>
          <div class="bookmarks art" style="display: none;">
          </div>
        </div>

      </div>

    </div>
  </body>

</html>
