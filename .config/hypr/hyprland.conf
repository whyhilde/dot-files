# display
monitor = , highres@highrr, auto, 1


# variables
$terminal = ghostty
$files = nemo
$menu = rofi -show drun

$activeBorder = rgba(89b4faff) rgba(a6e3a1ff) 45deg
$inactiveBorder = rgba(313244ff)
$colorShadow = rgba(181825cc)


# autostart
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "catppuccin-mocha-blue-standard+default"
exec-once = gsettings set org.gnome.desktop.interface icon-theme "Papirus-Dark"
exec-once = gsettings set org.gnome.desktop.interface font-name "JetBrains Mono Medium 12"

exec-once = hyprpaper
exec-once = hypridle
exec-once = waybar
exec-once = dunst


# environment variables
env = XCURSOR_THEME, catppuccin-mocha-light-cursors
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, catppuccin-mocha-light-cursors
env = HYPRCURSOR_SIZE, 24

env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

env = LIBVA_DRIVER_NAME, nvidia
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = GBM_BACKEND, nvidia-drm
env = ELECTRON_OZONE_PLATFORM_HINT, auto

env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_QPA_PLATFORMTHEME, qt5ct


# permissions
ecosystem:enforce_permissions = 0

permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprlock, capturescreen, allow


# appearance
general {
  gaps_in = 8
  gaps_out = 20

  border_size = 3
  col.active_border = $activeBorder
  col.inactive_border = $inactiveBorder
  resize_on_border = false
  no_border_on_floating = false

  layout = dwindle
  allow_tearing = false
}


decoration {
  rounding = 10
  rounding_power = 4

  active_opacity = 1.0
  inactive_opacity = 0.9

  shadow {
    enabled = true
    range = 15
    render_power = 3
    color = $colorShadow
  }

  blur {
    enabled = true
    size = 3
    passes = 2
    vibrancy = 0.1696
  }
}


# animations
animations {
  enabled = yes

  bezier = easeOutQuint,   0.23, 1,    0.32, 1
  bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
  bezier = linear,         0,    0,    1,    1
  bezier = almostLinear,   0.5,  0.5,  0.75, 1
  bezier = quick,          0.15, 0,    0.1,  1
  bezier = myBezier,       0.05, 0.9,  0.1,  1.05

  animation = global,        1, 10,   default,
  animation = border,        1, 5.39, easeOutQuint,
  animation = windows,       1, 4.79, easeOutQuint,
  animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
  animation = windowsOut,    1, 1.49, linear,       popin 87%
  animation = fadeIn,        1, 1.73, almostLinear,
  animation = fadeOut,       1, 1.46, almostLinear,
  animation = fade,          1, 3.03, quick,
  animation = layers,        1, 3.81, easeOutQuint,
  animation = layersIn,      1, 4,    easeOutQuint, fade
  animation = layersOut,     1, 1.5,  linear,       fade
  animation = fadeLayersIn,  1, 1.79, almostLinear,
  animation = fadeLayersOut, 1, 1.39, almostLinear,
  animation = zoomFactor,    1, 7,    quick,
  animation = workspaces,    1, 4,    default,
}


# layouts
dwindle {
  pseudotile = true
  force_split = 2
  preserve_split = true
  default_split_ratio = 1.0
}

master {
  new_status = master
  mfact = 0.50
  new_on_top = true
  orientation = left
}


# misc options
misc {
  force_default_wallpaper = -1
  disable_hyprland_logo = true
  font_family = JetBrains Mono
  animate_manual_resizes = false
  disable_autoreload = true
}


# cursor
cursor {
  no_warps = true
}


# input
input {
  kb_layout = us, ru
  kb_options = grp:win_space_toggle
  kb_variant =
  kb_model =
  kb_rules =
  repeat_delay = 275
  repeat_rate = 30

  follow_mouse = 0
  sensitivity = 0
}


# keybindings
$mod = SUPER

# general
bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, C, killactive,
bind = $mod ALT, C, forcekillactive,
bind = $mod, F, togglefloating,
bind = $mod, S, fullscreen,
bind = $mod ALT, R, exec, hyprctl reload
bind = $mod, V, exec, ~/.config/hypr/assets/layouts.sh

# launch software
bind = $mod ALT, F, exec, $files
bind = $mod ALT, M, exec, hyprlock
bind = $mod CTRL, C, exec, hyprpicker -a
bind = $mod CTRL, F, exec, grim ~/Pictures/$(date +"%H:%M_%d-%m-%y").png
bind = $mod CTRL, S, exec, grim -g "$(slurp -b 11111b80 -c cdd6f4ff)" ~/Pictures/$(date +"%H:%M_%d-%m-%y").png
bind = $mod, W, exec, ~/.config/scripts/wifi.sh
bind = $mod, G, exec, ~/.config/scripts/search.sh
bind = $mod, B, exec, ~/.config/scripts/bluetooth.sh
bind = $mod, X, exec, ~/.config/scripts/powermenu.sh

# move window focus
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# move windows
bind = $mod ALT, H, movewindow, l
bind = $mod ALT, J, movewindow, d
bind = $mod ALT, K, movewindow, u
bind = $mod ALT, L, movewindow, r

# change size of windows
bind = $mod CTRL, H, resizeactive, -50 0
bind = $mod CTRL, J, resizeactive, 0 50
bind = $mod CTRL, K, resizeactive, 0 -50
bind = $mod CTRL, L, resizeactive, 50 0

# switch workspace
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7

# move active window to workspace
bind = $mod ALT, 1, movetoworkspacesilent, 1
bind = $mod ALT, 2, movetoworkspacesilent, 2
bind = $mod ALT, 3, movetoworkspacesilent, 3
bind = $mod ALT, 4, movetoworkspacesilent, 4
bind = $mod ALT, 5, movetoworkspacesilent, 5
bind = $mod ALT, 6, movetoworkspacesilent, 6
bind = $mod ALT, 7, movetoworkspacesilent, 7

# volume control
bindel = , XF86AudioRaiseVolume, exec, ~/.config/scripts/volume.sh up
bindel = , XF86AudioLowerVolume, exec, ~/.config/scripts/volume.sh down
bindel = , XF86AudioMute, exec, ~/.config/scripts/volume.sh mute

# move/resize windows with LMB/RMB
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow


# windows rules
windowrule = float, class:nemo
windowrule = opacity 0.90, class:nemo
windowrule = size 1000 600, class:nemo

windowrule = float, class:org.pulseaudio.pavucontrol
windowrule = size 630 400, class:org.pulseaudio.pavucontrol
windowrule = move 1200 60, class:org.pulseaudio.pavucontrol

windowrule = float, class:imv
windowrule = size 1600 900, class:imv

windowrule = workspace 2, class:org.telegram.desktop

windowrule = workspace 3, class:firefox

windowrule = workspace 4, class:obsidian
windowrule = opacity 0.95, class:obsidian

windowrule = workspace 5, class:blender

windowrule = workspace 6, class:Spotify


# layers rules
layerrule = animation slide, rofi
layerrule = animation slide, notifications
