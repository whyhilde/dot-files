general {
  hide_cursor = true
  grace = 1
  fractional_scaling = 2
  immediate_render = true
}


background {
  monitor =
  path = ~/.config/hypr/assets/wall.png
  color = rgba(00000000)

  blur_size = 3
  blur_passes = 2
  noise = 0.0117
  contrast = 1.3000
  brightness = 0.6000
  vibrancy = 0.2100
  vibrancy_darkness = 0.0
}


label {
  monitor =
  text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
  color = rgba(cdd6f4ff)
  font_size = 112
  font_family = JetBrains Mono
  shadow_passes = 0
  shadow_size = 0

  position = 0, 220
  halign = center
  valign = center
}


label {
  monitor =
  text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
  color = rgba(cdd6f4ff)
  font_size = 112
  font_family = JetBrains Mono
  shadow_passes = 0
  shadow_size = 0

  position = 0, 80
  halign = center
  valign = center
}


label {
  monitor =
  text = Welcome, $USER
  color = rgba(cdd6f4ff)
  font_size = 18
  font_family = JetBrains Mono Medium
  position = 0, 200
  halign = center
  valign = bottom
}


input-field {
  monitor =
  size = 250, 50
  rounding = 22
  outline_thickness = 3

  dots_size = 0.26
  dots_spacing = 0.64
  dots_center = true
  dots_rouding = -1

  outer_color = rgba(00000000)
  inner_color = rgba(ffffff1a)
  font_color = rgba(cdd6f4ff)
  check_color = rgba(a6e3a1ff)
  fail_color = rgba(f38ba8ff)

  placeholder_text =
  fail_text =
  fade_on_empty = true

  position = 0, 120
  halign = center
  valign = bottom
}
