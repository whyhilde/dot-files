general {
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = false
  fractional_scaling = 2
  fail_timeout = 2000
}




background {
  monitor =
  # path = ~/.config/hypr/wallpapers/1.png
  color = rgba(1d2021ff)
  # blur_size = 3
  # blur_passes = 3
  # noise = 0
  # contrast = 1.3
  # brightness = 0.6
  # vibrancy = 0.2
  # vibrancy_darkness = 0
}


label {
  monitor =
  text = $TIME
  color = rgba(fbf1c7ff)
  font_size = 150
  font_family = JetBrains Mono NF Black

  halign = center
  valign = center
  position = 0, 100
}
