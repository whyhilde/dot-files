input-field {
  monitor =
  size = 250, 60
  rounding = 0
  outline_thickness = 5
  dots_size = 0.25
  dots_spacing = 0.6
  dots_center = true
  dots_rouding = -1
  font_color = rgba(fbf1c7ff)
  inner_color = rgba(3c3836ff)
  outer_color = rgba(7daea3ff)
  check_color = rgba(a9b665ff)
  fail_color = rgba(ea6962ff)
  placeholder_text =
  fail_text =
  fade_on_empty = false
  halign = center
  valign = center
  position = 0, -100
}


