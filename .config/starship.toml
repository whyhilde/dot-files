format = "$username$hostname$directory$git_branch\n$character"
right_format = ""
add_newline = true


[username]
show_always = true
format = "[$user]($style)"
style_user = "fg:red"


[hostname]
ssh_only = false
format = "@[$hostname]($style)"
style = "fg:red"


[directory]
home_symbol = "~"
read_only = ""
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = false
fish_style_pwd_dir_length = 1
format = " [$path]($style)"
style = "fg:green"


[git_branch]
truncation_length = 12
truncation_symbol = ".."
format = " \\([$branch]($style)\\)"
style = "fg:blue"


[character]
format = "$symbol"
success_symbol = "[& ](fg:green)"
error_symbol = "[& ](fg:red)"
