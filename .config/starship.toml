format = "$username$hostname$directory$git_branch$character"
right_format = ""
add_newline = false


[character]
success_symbol = "[ >](fg:#cdd6f4)"
error_symbol = "[ >](fg:#f38ba8)"


[username]
format = "[ $user](fg:#89b4fa)[@](fg:#cdd6f4)"
show_always = true


[hostname]
disabled = false
ssh_only = false
format = "[$hostname](fg:#89b4fa)"


[directory]
format = "[ $path](fg:#cdd6f4)"
home_symbol = "~"
truncation_length = 3
truncate_to_repo = false


[git_branch]
format = "[ \\($branch\\)](fg:#cdd6f4)"
