format = "$username[@](fg:normal)$hostname$directory$git_branch$character"
right_format = ""
add_newline = false


[character]
format = "$symbol"
success_symbol = "[ ~>> ](fg:normal)"
error_symbol = "[ ~>> ](fg:red)"


[username]
disabled = false
show_always = true
format = "[$user]($style)"
style_user = "fg:blue"


[hostname]
disabled = false
ssh_only = false
format = "[$hostname]($style)"
style = "fg:blue"


[directory]
format = " [$path]($style)"
style = "fg:green"
home_symbol = "~"
truncation_length = 1
truncate_to_repo = false
fish_style_pwd_dir_length = 1


[git_branch]
format = " [\\($branch\\)]($style)"
style = "fg:normal"
truncation_length = 12
truncation_symbol = ".."
